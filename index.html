<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Juego: Piedra, Papel y Tijeras</h1>
    <div>
      <button id="btnRock">Piedra</button>
      <button id="btnPaper">Papel</button>
      <button id="btnScissor">Tijeras</button>
    </div>
    <div class="msg-container">
      <p class="text-player"></p>
      <p class="text-cpu"></p>
      <p class="text-result"></p>
    </div>
    <div class="main-container">
      <div class="content">
        <p>Victorias:</p>
        <p>Empates:</p>
        <p>Derrotas:</p>
      </div>
      <div class="result-content">
        <h4 id="winResult">0</h4>
        <h4 id="drawResult">0</h4>
        <h4 id="loseResult">0</h4>
      </div>
    </div>
    <button id="btnReset">Reset</button>

    <script src="script.js"></script>
  </body>
</html>
